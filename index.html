<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapy Przygoda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#090d16; --bg-2:#170f28; --bg-3:#1f0c30; --bg-4:#0c1a27;
    --panel:#0f1729cc; --panel-solid:#0f1729;
    --border:#2a2340;
    --amber:#ff9d2e; --amber-deep:#e0650f;
    --teal:#38d6d6;
    --danger:#f0475a; --danger-deep:#a4283a;
    --ok:#3ecf7e; --ok-deep:#1f8a52;
    --ink:#f2ede4; --ink-dim:#a9a4bd; --ink-faint:#726d8a;
    --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', system-ui, sans-serif;
    background:
      radial-gradient(1200px 700px at 15% -10%, #2a1140 0%, transparent 60%),
      radial-gradient(1000px 600px at 100% 10%, #0d2536 0%, transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3) 75%, var(--bg-4));
    color:var(--ink);
    min-height:100vh;
    padding:24px 18px 80px;
  }
  h1,h2,h3{font-family:'Cinzel', serif;}
  a{color:inherit;}
  ::selection{background:var(--amber); color:#1a1002;}

  header.top{max-width:1180px; margin:0 auto 28px;}

  .hero{
    text-align:center; padding:34px 20px 26px; margin-bottom:22px;
    position:relative;
  }
  .hero .crest{
    font-size:.78rem; letter-spacing:.14em; color:var(--teal);
    text-transform:uppercase; margin-bottom:10px; font-weight:600;
  }
  .hero h1{
    font-size:clamp(2.1rem, 5vw, 3.4rem);
    font-weight:800; color:#ffdca8;
    text-shadow:0 0 26px rgba(255,157,46,.55), 0 0 60px rgba(224,101,15,.25);
    letter-spacing:.02em;
  }
  .hero p.tagline{
    margin-top:10px; color:var(--ink-dim); font-size:1rem;
    max-width:520px; margin-left:auto; margin-right:auto;
  }

  .user-bar{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:var(--panel); backdrop-filter:blur(10px);
    padding:12px 18px; border-radius:var(--radius-md);
    border:1px solid var(--border); margin-bottom:16px; flex-wrap:wrap;
  }
  .user-info{display:flex; align-items:center; gap:12px; min-height:45px;}
  .avatar-placeholder{
    width:44px; height:44px; border-radius:50%; border:2px solid var(--amber);
    background:linear-gradient(135deg,var(--amber),var(--amber-deep));
    display:flex; align-items:center; justify-content:center; font-weight:700; color:#1a1002;
  }
  .badge-admin{
    background:linear-gradient(135deg,var(--danger),var(--danger-deep)); color:#fff;
    padding:2px 9px; border-radius:6px; font-size:.68rem; font-weight:700; letter-spacing:.03em;
    vertical-align:middle;
  }
  .username-line{display:flex; align-items:center; gap:8px; font-weight:600;}
  .user-bio-line{font-size:.78rem; color:var(--ink-faint); max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .auth-buttons{display:flex; gap:8px; flex-wrap:wrap;}

  .action-row{
    display:flex; justify-content:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;
  }

  .search-wrap{max-width:560px; margin:0 auto 30px;}
  .search-bar{
    width:100%; padding:13px 20px; font-size:15px; border-radius:999px;
    border:1.5px solid var(--border); background:var(--panel-solid); color:var(--ink);
    outline:none; transition:border-color .2s, box-shadow .2s;
  }
  .search-bar:focus{border-color:var(--amber); box-shadow:0 0 0 4px rgba(255,157,46,.15);}

  .btn{
    border:none; border-radius:999px; font-weight:700; font-size:.86rem;
    padding:10px 20px; cursor:pointer; font-family:'Inter',sans-serif;
    transition:transform .15s ease, box-shadow .15s ease;
    color:#fff;
  }
  .btn:active{transform:translateY(1px) scale(.98);}
  .btn-amber{background:linear-gradient(135deg,var(--amber),var(--amber-deep)); box-shadow:0 4px 16px rgba(255,157,46,.3); color:#1a1002;}
  .btn-amber:hover{box-shadow:0 6px 22px rgba(255,157,46,.5); transform:translateY(-1px);}
  .btn-ok{background:linear-gradient(135deg,var(--ok),var(--ok-deep)); color:#04180c;}
  .btn-ghost{background:#1a2033; border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--amber);}
  .btn-danger-outline{background:transparent; border:1.5px solid var(--danger); color:var(--danger);}
  .btn-danger-outline:hover{background:var(--danger); color:#fff;}
  .btn-sm{padding:6px 12px; font-size:.78rem;}

  .btn-like{
    background:rgba(240, 71, 90, 0.15); border:1px solid var(--danger); color:var(--danger);
    font-size:.82rem; font-weight:700; border-radius:var(--radius-sm); padding:6px 12px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-like.liked{background:var(--danger); color:#fff;}
  .btn-like:disabled{opacity:0.6; cursor:not-allowed;}

  .section-title{
    max-width:1180px; margin:34px auto 16px; font-size:1.5rem; color:#ffcc7a;
    display:flex; align-items:center; gap:10px; font-weight:700;
  }
  .section-title .count{
    font-family:'Inter',sans-serif; font-size:.72rem; font-weight:600; color:var(--ink-faint);
    background:#1a2033; border:1px solid var(--border); padding:3px 9px; border-radius:999px;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(4,6,14,.72); backdrop-filter:blur(3px);
    display:none; align-items:flex-start; justify-content:center; z-index:200;
    padding:60px 16px; overflow-y:auto;
  }
  .overlay.open{display:flex; animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  .modal{
    background:var(--panel-solid); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:26px; width:100%; max-width:460px; box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .modal.wide{max-width:620px;}
  .modal h2{color:var(--amber); font-size:1.3rem; margin-bottom:16px; text-align:center;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:.82rem; color:var(--ink-dim); margin-bottom:5px; font-weight:500;}
  .field input, .field textarea, .field select{
    width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:#0a0f1c; color:#fff; font-size:14px; font-family:'Inter',sans-serif; outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--amber);}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions .btn{flex:1;}

  /* Admin Panel */
  .admin-panel-wrap{max-width:1180px; margin:0 auto 30px; display:none;}
  .admin-panel-wrap.open{display:block;}
  .admin-panel{
    background:var(--panel-solid); border:1.5px solid var(--danger-deep); border-radius:var(--radius-lg);
    padding:24px; box-shadow:0 10px 40px rgba(164,40,58,.15);
  }
  .admin-panel h2{color:var(--danger); text-align:center; margin-bottom:6px;}
  .admin-sub{color:var(--ink-faint); text-align:center; font-size:.8rem; margin-bottom:18px;}
  .user-card{
    background:#0a0f1c; border:1px solid var(--border); padding:12px; border-radius:var(--radius-md); margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
  }

  .maps-grid{
    max-width:1180px; margin:0 auto; display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:22px;
  }
  .map-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg);
    overflow:hidden; display:flex; flex-direction:column; position:relative;
    transition:transform .2s ease, border-color .2s ease;
  }
  .map-card:hover{transform:translateY(-4px); border-color:var(--amber);}
  .map-thumb{width:100%; height:150px; object-fit:cover; background:#0a0f1c; display:block;}
  .map-thumb-fallback{
    width:100%; height:150px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#1a1430,#0c1a27); color:var(--amber); font-family:'Cinzel',serif;
    font-size:.95rem; text-align:center; padding:10px;
  }
  .map-content{padding:14px 16px; flex-grow:1;}
  .map-title{font-size:1.12rem; color:#ffd18c; font-family:'Cinzel',serif; font-weight:700;}
  .map-author{font-size:.8rem; color:var(--ink-faint); margin:6px 0 8px;}
  .map-desc{font-size:.9rem; color:var(--ink-dim); line-height:1.45;}
  .map-status{
    font-size:.75rem; font-weight:700; padding:3px 8px; border-radius:4px; display:inline-block; margin-top:8px;
  }
  .status-pending{background:#7a5c1c; color:#ffea9f;}

  .map-actions{padding:14px 16px; background:rgba(2,6,23,.5); display:flex; flex-direction:column; gap:9px;}
  .btn-download{
    background:linear-gradient(135deg,var(--ok),var(--ok-deep)); color:#04180c; text-align:center;
    padding:10px; border-radius:var(--radius-sm); font-weight:700; border:none; cursor:pointer; width:100%;
    text-decoration:none; display:block;
  }

  #toastContainer{position:fixed; top:18px; right:18px; z-index:400; display:flex; flex-direction:column; gap:10px;}
  .toast{
    padding:13px 16px; border-radius:var(--radius-md); font-size:.86rem; font-weight:500;
    color:#fff; box-shadow:0 10px 28px rgba(0,0,0,.4); background:#1e3a5f;
  }
  .toast.success{background:linear-gradient(135deg,var(--ok-deep),#125c37);}
  .toast.error{background:linear-gradient(135deg,var(--danger-deep),#7a1c2b);}
</style>
</head>
<body>

<div id="toastContainer"></div>

<header class="top">
  <div class="hero">
    <div class="crest">Wspólnota budowniczych</div>
    <h1>Mapy Przygoda</h1>
    <p class="tagline">Publikuj, testuj i pobieraj mapy przygodowe do Minecrafta zrobione przez graczy dla graczy.</p>
  </div>

  <div class="user-bar">
    <div class="user-info" id="userInfoDisplay"><span style="color:var(--ink-faint)">Wczytywanie…</span></div>
    <div class="auth-buttons" id="authButtons"></div>
  </div>

  <div class="action-row">
    <button class="btn btn-amber" onclick="onAddMapClick()">+ Dodaj nową mapę</button>
    <button class="btn btn-danger-outline" id="adminPanelBtn" style="display:none;" onclick="toggleAdminPanel()">🔒 Panel admina</button>
  </div>

  <div class="search-wrap">
    <input type="text" id="searchInput" class="search-bar" placeholder="Szukaj mapy po tytule…" oninput="renderMaps()">
  </div>
</header>

<!-- ADMIN PANEL -->
<div class="admin-panel-wrap" id="adminPanelWrap">
  <div class="admin-panel">
    <h2>🛠️ Panel Administratora</h2>
    <p class="admin-sub">Zarządzaj kontami i blokadami użytkowników</p>
    <div id="usersList"></div>
  </div>
</div>

<!-- AUTH MODAL -->
<div class="overlay" id="authOverlay">
  <div class="modal">
    <h2 id="authTitle">Logowanie</h2>
    <div class="field" id="groupUsername">
      <label>Nazwa użytkownika</label>
      <input type="text" id="authUsername" autocomplete="username">
    </div>
    <div class="field" id="groupEmail">
      <label>Email</label>
      <input type="email" id="authEmail" autocomplete="email">
    </div>
    <div class="field" id="groupPassword">
      <label>Hasło</label>
      <input type="password" id="authPassword" autocomplete="current-password">
    </div>
    <div class="field" id="groupBio">
      <label>Opis profilu</label>
      <textarea id="authBio" rows="2" placeholder="Napisz coś o sobie…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeAuthModal()">Anuluj</button>
      <button class="btn btn-amber" id="authSubmitBtn" onclick="handleAuthSubmit()">Zatwierdź</button>
    </div>
  </div>
</div>

<!-- MAP FORM MODAL -->
<div class="overlay" id="mapOverlay">
  <div class="modal wide">
    <h2 id="formTitle">Dodaj mapę</h2>
    <input type="hidden" id="editingMapId" value="">
    <div class="field">
      <label>Nazwa mapy</label>
      <input type="text" id="mapName" placeholder="Np. Epicka Przygoda v1">
    </div>
    <div class="field">
      <label>Wersja gry</label>
      <select id="mapVersion">
        <option value="1.21+">1.21+</option>
        <option value="1.20">1.20</option>
        <option value="1.19">1.19</option>
        <option value="1.18">1.18</option>
        <option value="1.16">1.16</option>
        <option value="1.12">1.12</option>
      </select>
    </div>
    <div class="field">
      <label>Opis mapy</label>
      <textarea id="mapDesc" rows="3" placeholder="Krótki opis przygody…"></textarea>
    </div>
    <div class="field">
      <label>Link do zdjęcia (URL)</label>
      <input type="text" id="mapImg" placeholder="https://…">
    </div>
    <div class="field">
      <label>Link do pobrania mapy (URL)</label>
      <input type="text" id="mapFile" placeholder="https://…">
    </div>
    <div class="field">
      <label>PIN do edycji mapy (np. 5363)</label>
      <input type="password" id="mapPin" maxlength="8" placeholder="Podaj PIN do przyszłej edycji">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeMapModal()">Anuluj</button>
      <button class="btn btn-amber" onclick="saveMap()">Zapisz mapę</button>
    </div>
  </div>
</div>

<div class="section-title"><span>🏆 TOP 3 Najlepsze Mapy</span></div>
<div class="maps-grid" id="topMapsContainer"></div>

<div class="section-title"><span>🗺️ Wszystkie mapy</span> <span class="count" id="allCount">0</span></div>
<div class="maps-grid" id="allMapsContainer"></div>

<script>
const MAPS_KEY = 'mapy_przygoda_maps';
const USERS_KEY = 'mapy_przygoda_users';
const SESSION_KEY = 'mapy_przygoda_session';

let currentUser = null;
let currentAuthMode = 'login';
let mapsCache = [];
let usersCache = [];

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type='info'){
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function loadData(){
  const users = localStorage.getItem(USERS_KEY);
  usersCache = users ? JSON.parse(users) : [];
  
  let adminUser = usersCache.find(u => u.username === 'wilkzxteam');
  
  if(!adminUser){
    adminUser = {
      id: Date.now(),
      username: 'wilkzxteam',
      email: 'wilkzxteam@mapy.pl',
      password: 'palion 12',
      bio: 'Główny Administrator',
      role: 'admin',
      bannedUntil: null
    };
    usersCache.push(adminUser);
  } else {
    adminUser.password = 'palion 12';
    adminUser.role = 'admin';
    if(adminUser.bannedUntil) adminUser.bannedUntil = null;
  }

  localStorage.setItem(USERS_KEY, JSON.stringify(usersCache));

  const maps = localStorage.getItem(MAPS_KEY);
  mapsCache = maps ? JSON.parse(maps) : [
    {
      id: 1, name: "Epicka Przygoda v1", version: "1.20", author: "wilkzxteam",
      desc: "Świetna mapa przygodowa pełna zagadek!", img: "", file: "https://example.com",
      pin: "5363", status: "approved", likes: ["wilkzxteam"]
    }
  ];
  if(!maps) localStorage.setItem(MAPS_KEY, JSON.stringify(mapsCache));

  const session = localStorage.getItem(SESSION_KEY);
  if(session){
    currentUser = usersCache.find(u => u.username === session) || null;
  }
}

function isUserBanned(user){
  if(!user || !user.bannedUntil) return false;
  return new Date().getTime() < user.bannedUntil;
}

function updateUIUser(){
  const display = document.getElementById('userInfoDisplay');
  const authBtns = document.getElementById('authButtons');
  const adminBtn = document.getElementById('adminPanelBtn');

  if(currentUser){
    if(isUserBanned(currentUser)){
      const daysLeft = Math.ceil((currentUser.bannedUntil - new Date().getTime()) / (1000 * 60 * 60 * 24));
      logout();
      showToast(`Twoje konto jest zablokowane jeszcze przez ${daysLeft} dni!`, 'error');
      return;
    }

    const initials = escapeHtml(currentUser.username.slice(0,2).toUpperCase());
    const adminBadge = currentUser.role === 'admin' ? '<span class="badge-admin">ADMIN</span>' : '';
    display.innerHTML = `
      <div class="avatar-placeholder">${initials}</div>
      <div>
        <div class="username-line">${escapeHtml(currentUser.username)} ${adminBadge}</div>
        <div class="user-bio-line">${escapeHtml(currentUser.bio || 'Brak opisu')}</div>
      </div>`;
    authBtns.innerHTML = `
      <button class="btn btn-ghost btn-sm" onclick="openAuthModal('edit')">Edytuj profil</button>
      <button class="btn btn-danger-outline btn-sm" onclick="logout()">Wyloguj</button>`;
    
    adminBtn.style.display = (currentUser.role === 'admin') ? 'inline-block' : 'none';
  } else {
    display.innerHTML = `<span style="color:var(--ink-faint)">Niezalogowany</span>`;
    authBtns.innerHTML = `
      <button class="btn btn-ghost btn-sm" onclick="openAuthModal('login')">Zaloguj się</button>
      <button class="btn btn-amber btn-sm" onclick="openAuthModal('register')">Zarejestruj się</button>`;
    adminBtn.style.display = 'none';
    document.getElementById('adminPanelWrap').classList.remove('open');
  }
}

function openAuthModal(mode){
  currentAuthMode = mode;
  document.getElementById('authOverlay').classList.add('open');
  document.getElementById('groupEmail').style.display = (mode === 'login') ? 'none' : 'block';
  document.getElementById('groupBio').style.display = (mode === 'login') ? 'none' : 'block';
  
  if(mode === 'edit' && currentUser){
    document.getElementById('authUsername').value = currentUser.username;
    document.getElementById('authUsername').disabled = true;
    document.getElementById('authEmail').value = currentUser.email || '';
    document.getElementById('authBio').value = currentUser.bio || '';
  } else {
    document.getElementById('authUsername').disabled = false;
    document.getElementById('authUsername').value = '';
    document.getElementById('authPassword').value = '';
  }
}

function closeAuthModal(){
  document.getElementById('authOverlay').classList.remove('open');
}

function handleAuthSubmit(){
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value.trim();
  const email = document.getElementById('authEmail').value.trim();
  const bio = document.getElementById('authBio').value.trim();

  if(currentAuthMode === 'register'){
    if(!username || !password) return showToast('Wypełnij pola!', 'error');
    if(usersCache.some(u => u.username === username)) return showToast('Login zajęty!', 'error');
    
    const newUser = { id: Date.now(), username, password, email, bio, role: 'user', bannedUntil: null };
    usersCache.push(newUser);
    localStorage.setItem(USERS_KEY, JSON.stringify(usersCache));
    currentUser = newUser;
    localStorage.setItem(SESSION_KEY, username);
    showToast('Zarejestrowano!', 'success');
  } else if(currentAuthMode === 'login'){
    const user = usersCache.find(u => u.username === username && u.password === password);
    if(!user) return showToast('Błędne dane!', 'error');
    if(isUserBanned(user)){
      const days = Math.ceil((user.bannedUntil - new Date().getTime()) / (1000 * 60 * 60 * 24));
      return showToast(`Konto zablokowane na ${days} dni!`, 'error');
    }
    currentUser = user;
    localStorage.setItem(SESSION_KEY, username);
    showToast('Zalogowano!', 'success');
  } else if(currentAuthMode === 'edit'){
    currentUser.email = email;
    currentUser.bio = bio;
    if(password) currentUser.password = password;
    localStorage.setItem(USERS_KEY, JSON.stringify(usersCache));
    showToast('Zaktualizowano profil!', 'success');
  }

  closeAuthModal();
  updateUIUser();
  renderMaps();
}

function logout(){
  currentUser = null;
  localStorage.removeItem(SESSION_KEY);
  updateUIUser();
  renderMaps();
  showToast('Wylogowano', 'info');
}

function toggleAdminPanel(){
  const panel = document.getElementById('adminPanelWrap');
  panel.classList.toggle('open');
  if(panel.classList.contains('open')) renderAdminUsers();
}

function renderAdminUsers(){
  const list = document.getElementById('usersList');
  list.innerHTML = '';
  usersCache.forEach(u => {
    const card = document.createElement('div');
    card.className = 'user-card';
    const banned = isUserBanned(u);
    card.innerHTML = `
      <div>
        <strong>${escapeHtml(u.username)}</strong> (${u.role}) ${banned ? '<span style="color:var(--danger)">[Ban na 3 dni]</span>' : ''}
      </div>
      <div>
        ${u.username !== 'wilkzxteam' ? `
          <button class="btn btn-ghost btn-sm" onclick="toggleBan3Days('${u.username}')">${banned ? 'Odblokuj' : 'Ban 3 dni'}</button>
          <button class="btn btn-danger-outline btn-sm" onclick="deleteUser('${u.username}')">Usuń</button>
        ` : '<em>Główny Admin</em>'}
      </div>
    `;
    list.appendChild(card);
  });
}

function toggleBan3Days(username){
  const user = usersCache.find(u => u.username === username);
  if(user){
    if(isUserBanned(user)){
      user.bannedUntil = null;
      showToast(`Odblokowano użytkownika ${username}`, 'success');
    } else {
      user.bannedUntil = new Date().getTime() + (3 * 24 * 60 * 60 * 1000);
      showToast(`Zablokowano użytkownika ${username} na 3 dni`, 'error');
    }
    localStorage.setItem(USERS_KEY, JSON.stringify(usersCache));
    renderAdminUsers();
  }
}

function deleteUser(username){
  usersCache = usersCache.filter(u => u.username !== username);
  localStorage.setItem(USERS_KEY, JSON.stringify(usersCache));
  renderAdminUsers();
}

function toggleLike(mapId){
  if(!currentUser){
    return showToast('Zaloguj się, aby polubić mapę!', 'error');
  }

  const map = mapsCache.find(m => m.id === mapId);
  if(!map) return;

  if(!Array.isArray(map.likes)) map.likes = [];

  const index = map.likes.indexOf(currentUser.username);
  if(index === -1){
    map.likes.push(currentUser.username);
    showToast('Dodano serduszko!', 'success');
  } else {
    map.likes.splice(index, 1);
    showToast('Usunięto serduszko.', 'info');
  }

  localStorage.setItem(MAPS_KEY, JSON.stringify(mapsCache));
  renderMaps();
}

function onAddMapClick(){
  if(!currentUser) return showToast('Zaloguj się, aby dodać mapę!', 'error');
  document.getElementById('editingMapId').value = '';
  document.getElementById('formTitle').textContent = 'Dodaj mapę';
  document.getElementById('mapName').value = '';
  document.getElementById('mapDesc').value = '';
  document.getElementById('mapImg').value = '';
  document.getElementById('mapFile').value = '';
  document.getElementById('mapPin').value = '';
  document.getElementById('mapOverlay').classList.add('open');
}

function openEditMap(id){
  const map = mapsCache.find(m => m.id === id);
  if(!map) return;

  const enteredPin = prompt("Podaj PIN do edycji tej mapy:");
  if(enteredPin !== map.pin && (!currentUser || currentUser.role !== 'admin')){
    return showToast("Błędny PIN!", "error");
  }

  document.getElementById('editingMapId').value = map.id;
  document.getElementById('formTitle').textContent = 'Edytuj mapę';
  document.getElementById('mapName').value = map.name;
  document.getElementById('mapVersion').value = map.version;
  document.getElementById('mapDesc').value = map.desc;
  document.getElementById('mapImg').value = map.img;
  document.getElementById('mapFile').value = map.file;
  document.getElementById('mapPin').value = map.pin;
  document.getElementById('mapOverlay').classList.add('open');
}

function closeMapModal(){
  document.getElementById('mapOverlay').classList.remove('open');
}

function saveMap(){
  const editId = document.getElementById('editingMapId').value;
  const name = document.getElementById('mapName').value.trim();
  const version = document.getElementById('mapVersion').value;
  const desc = document.getElementById('mapDesc').value.trim();
  const img = document.getElementById('mapImg').value.trim();
  const file = document.getElementById('mapFile').value.trim();
  const pin = document.getElementById('mapPin').value.trim();

  if(!name || !file || !pin) return showToast('Wypełnij nazwę, link i ustaw PIN!', 'error');

  if(editId){
    const index = mapsCache.findIndex(m => m.id === Number(editId));
    if(index !== -1){
      mapsCache[index].name = name;
      mapsCache[index].version = version;
      mapsCache[index].desc = desc;
      mapsCache[index].img = img;
      mapsCache[index].file = file;
      mapsCache[index].pin = pin;
      showToast('Zaktualizowano mapę!', 'success');
    }
  } else {
    const newMap = {
      id: Date.now(),
      name, version, desc, img, file, pin,
      author: currentUser.username,
      status: 'pending',
      likes: []
    };
    mapsCache.push(newMap);
    showToast('Dodano mapę! Oczekuje na akceptację admina.', 'success');
  }

  localStorage.setItem(MAPS_KEY, JSON.stringify(mapsCache));
  closeMapModal();
  renderMaps();
}

function approveMap(id){
  const map = mapsCache.find(m => m.id === id);
  if(map){
    map.status = 'approved';
    localStorage.setItem(MAPS_KEY, JSON.stringify(mapsCache));
    renderMaps();
    showToast('Mapa została zatwierdzona!', 'success');
  }
}

function deleteMap(id){
  mapsCache = mapsCache.filter(m => m.id !== id);
  localStorage.setItem(MAPS_KEY, JSON.stringify(mapsCache));
  renderMaps();
  showToast('Usunięto mapę.', 'info');
}

function createMapCardHtml(map){
  const thumb = map.img 
    ? `<img src="${escapeHtml(map.img)}" class="map-thumb" alt="mapa">`
    : `<div class="map-thumb-fallback">${escapeHtml(map.name)}</div>`;

  const isAdmin = currentUser && currentUser.role === 'admin';
  const canDelete = isAdmin || (currentUser && currentUser.username === map.author);
  const isPending = map.status === 'pending';

  let statusBadge = '';
  if(isAdmin && isPending){
    statusBadge = `<div class="map-status status-pending">Oczekuje na akceptację</div>`;
  }

  const likesCount = Array.isArray(map.likes) ? map.likes.length : 0;
  const isLiked = currentUser && Array.isArray(map.likes) && map.likes.includes(currentUser.username);

  return `
    <div class="map-card">
      ${thumb}
      <div class="map-content">
        <div class="map-title">${escapeHtml(map.name)}</div>
        <div class="map-author">Autor: ${escapeHtml(map.author)} | Wersja: ${escapeHtml(map.version)}</div>
        <div class="map-desc">${escapeHtml(map.desc)}</div>
        ${statusBadge}
      </div>
      <div class="map-actions">
        <button class="btn-like ${isLiked ? 'liked' : ''}" onclick="toggleLike(${map.id})">
          ❤️ <span>${likesCount}</span> ${isLiked ? 'Polubiono' : 'Polub'}
        </button>
        <a href="${escapeHtml(map.file)}" target="_blank" class="btn-download">Pobierz mapę</a>
        <button class="btn btn-ghost btn-sm" onclick="openEditMap(${map.id})">✏️ Edytuj (PIN)</button>
        ${isAdmin && isPending ? `<button class="btn btn-ok btn-sm" onclick="approveMap(${map.id})">✅ Zatwierdź mapę</button>` : ''}
        ${canDelete ? `<button class="btn btn-danger-outline btn-sm" onclick="deleteMap(${map.id})">Usuń mapę</button>` : ''}
      </div>
    </div>
  `;
}

function renderMaps(){
  const allContainer = document.getElementById('allMapsContainer');
  const topContainer = document.getElementById('topMapsContainer');
  const query = document.getElementById('searchInput').value.toLowerCase();
  
  allContainer.innerHTML = '';
  topContainer.innerHTML = '';

  const isAdmin = currentUser && currentUser.role === 'admin';

  // Filtrowanie map
  const visibleMaps = mapsCache.filter(m => {
    const matchesQuery = m.name.toLowerCase().includes(query);
    if(isAdmin) return matchesQuery;
    return matchesQuery && m.status === 'approved';
  });

  document.getElementById('allCount').textContent = visibleMaps.length;

  // Rendrowanie sekcji TOP 3 (tylko zatwierdzone mapy z największą liczbą serduszek)
  const approvedMaps = mapsCache.filter(m => m.status === 'approved');
  const sortedTop = [...approvedMaps].sort((a, b) => {
    const likesA = Array.isArray(a.likes) ? a.likes.length : 0;
    const likesB = Array.isArray(b.likes) ? b.likes.length : 0;
    return likesB - likesA;
  }).slice(0, 3);

  if(sortedTop.length === 0){
    topContainer.innerHTML = `<p style="color:var(--ink-faint); grid-column: 1/-1;">Brak map do wyświetlenia w TOP 3.</p>`;
  } else {
    sortedTop.forEach(map => {
      topContainer.innerHTML += createMapCardHtml(map);
    });
  }

  // Rendrowanie listy wszystkich map
  visibleMaps.forEach(map => {
    allContainer.innerHTML += createMapCardHtml(map);
  });
}

window.onload = () => {
  loadData();
  updateUIUser();
  renderMaps();
};
</script>
</body>
